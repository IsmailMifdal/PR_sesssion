name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Seulement un booléen : le jeton lui-même n'est exposé qu'à l'étape Sonar.
      HAS_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # analyse SonarCloud
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # PostgreSQL réel via Testcontainers (Docker est disponible sur les runners GitHub).
      - name: Tests (JUnit + Testcontainers) et couverture
        working-directory: backend
        run: mvn -B verify
      - name: Analyse SonarCloud
        if: ${{ env.HAS_SONAR == 'true' }}
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization="$SONAR_ORGANIZATION" -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
