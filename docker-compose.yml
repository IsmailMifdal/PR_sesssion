# Démarrage local : `docker compose up --build`. Variables lues dans .env (voir .env.example).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  tmpfs:
    - /tmp:size=4g,mode=1777

x-database: &database
  SENTINEL_DATABASE_URL: jdbc:postgresql://db:5432/sentinel
  SENTINEL_DATABASE_USER: sentinel
  SENTINEL_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: sentinel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 2s
      retries: 30

  # Webhook + tableau de bord : ne reçoit ni la clé de la GitHub App ni la clé OpenAI.
  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    <<: *hardening
    environment:
      <<: *database
      SENTINEL_WORKER_ENABLED: "false"
      SENTINEL_WEBHOOK_SECRET: ${SENTINEL_WEBHOOK_SECRET:?secret de webhook requis}
      SENTINEL_DASHBOARD_TOKEN: ${SENTINEL_DASHBOARD_TOKEN:-}
      SENTINEL_DASHBOARD_ALLOWED_ORIGINS: ${SENTINEL_DASHBOARD_ALLOWED_ORIGINS:-}
      SENTINEL_GITHUB_CLIENT_ID: ${SENTINEL_GITHUB_CLIENT_ID:-}
      SENTINEL_GITHUB_APP_SLUG: ${SENTINEL_GITHUB_APP_SLUG:-}
      SENTINEL_GITHUB_CLIENT_SECRET: ${SENTINEL_GITHUB_CLIENT_SECRET:-}
      SENTINEL_PUBLIC_URL: ${SENTINEL_PUBLIC_URL:-}
      SENTINEL_FRONT_URL: ${SENTINEL_FRONT_URL:-}
      SENTINEL_STRIPE_SECRET_KEY: ${SENTINEL_STRIPE_SECRET_KEY:-}
      SENTINEL_STRIPE_WEBHOOK_SECRET: ${SENTINEL_STRIPE_WEBHOOK_SECRET:-}
      SENTINEL_STRIPE_PRICE_EQUIPE: ${SENTINEL_STRIPE_PRICE_EQUIPE:-}
    ports: ["8080:8080"]
    mem_limit: 768m
    depends_on:
      db: {condition: service_healthy}

  # Worker : clone, scanners, agent IA, publication sur GitHub.
  worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    <<: *hardening
    environment:
      <<: *database
      SENTINEL_WORKER_ENABLED: "true"
      # Le worker ne reçoit pas de webhook : il n'a pas besoin du secret.
      SENTINEL_WEBHOOK_ENABLED: "false"
      SENTINEL_GITHUB_APP_ID: ${SENTINEL_GITHUB_APP_ID:?identifiant de la GitHub App requis}
      SENTINEL_GITHUB_PRIVATE_KEY: ${SENTINEL_GITHUB_PRIVATE_KEY:?clé privée de la GitHub App requise}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENTINEL_DAILY_BUDGET_USD: ${SENTINEL_DAILY_BUDGET_USD:-1.00}
    mem_limit: 4g
    # Laisse finir la revue en cours à l'arrêt.
    stop_grace_period: 30m
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
